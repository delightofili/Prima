name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days, 06:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  # Two separate jobs: if one project fails you hear about it, and the other is still checked
  staging:
    runs-on: ubuntu-24.04 # pinned, so a new default image can never change this job without you knowing
    timeout-minutes: 10 # a hung call can never run for hours
    steps:
      - uses: actions/checkout@v4
      - name: Call keepalive() on the TEST project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash scripts/keepalive.sh staging SUPABASE_URL SUPABASE_ANON_KEY

  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Call keepalive() on the PRODUCTION project
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: bash scripts/keepalive.sh production PROD_SUPABASE_URL PROD_SUPABASE_ANON_KEY
