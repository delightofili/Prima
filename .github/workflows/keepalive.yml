name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days, 06:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-24.04 # pinned, so a new default image can never change this job without you knowing
    timeout-minutes: 10 # a hung call can never run for hours
    steps:
      - name: Call keepalive() (explains any problem, up to 5 tries)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1. Tidy what was pasted into the secrets. A stray space, a line break or a final slash is the usual reason for "malformed URL".
          SUPABASE_URL="$(printf '%s' "${SUPABASE_URL:-}" | tr -d '[:space:]')"
          SUPABASE_URL="${SUPABASE_URL%/}"
          SUPABASE_KEY="$(printf '%s' "${SUPABASE_KEY:-}" | tr -d '[:space:]')"

          # 2. Say clearly what is wrong, before calling anything
          if [ -z "$SUPABASE_URL" ]; then
            echo "The SUPABASE_URL secret is empty or does not exist."
            echo "Add it: repo > Settings > Secrets and variables > Actions > New repository secret. Name: SUPABASE_URL"
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "SUPABASE_URL does not look right. It should look like https://abcdefgh.supabase.co (starting with https://)."
              exit 1
              ;;
          esac
          if [ -z "$SUPABASE_KEY" ]; then
            echo "The SUPABASE_ANON_KEY secret is empty or does not exist."
            echo "Add it: repo > Settings > Secrets and variables > Actions > New repository secret. Name: SUPABASE_ANON_KEY"
            exit 1
          fi
          echo "Calling $SUPABASE_URL (key present, $((${#SUPABASE_KEY})) characters)"

          # 3. Call the database. A temporary hiccup gets more tries; a problem that cannot fix itself stops at once.
          url="$SUPABASE_URL/rest/v1/rpc/keepalive"
          tries=5
          for attempt in $(seq 1 "$tries"); do
            rc=0
            code=$(curl -sS --max-time 30 -o response.txt -w "%{http_code}" -X POST "$url" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d '{}') || rc=$?
            if [ "$rc" -ne 0 ]; then code="000"; fi
            echo "Try $attempt of $tries: HTTP $code (curl exit $rc)"
            if [ "$code" = "200" ]; then
              cat response.txt
              echo
              echo "The database answered. It will not pause."
              exit 0
            fi
            cat response.txt 2>/dev/null || true
            echo
            if [ "$rc" = "3" ]; then
              echo "The web address is malformed. Check the SUPABASE_URL secret."
              exit 1
            fi
            if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ]; then
              echo "This will not fix itself by waiting: check the SUPABASE_ANON_KEY secret, and that the keepalive function exists (Day 15 SQL)."
              exit 1
            fi
            if [ "$attempt" -lt "$tries" ]; then
              echo "Waiting $((attempt * 20)) seconds before trying again..."
              sleep $((attempt * 20))
            fi
          done
          echo "Still no answer after $tries tries. Open the Supabase dashboard: the project may be paused."
          exit 1
